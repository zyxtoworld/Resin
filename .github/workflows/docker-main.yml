name: Build Main Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: docker-main
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-webui:
    name: Build WebUI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Upload WebUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: resin-webui-dist
          path: webui/dist
          if-no-files-found: error
          retention-days: 1

  verify-race:
    name: Verify Go race tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-webui
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true

      - name: Download WebUI artifact
        uses: actions/download-artifact@v4
        with:
          name: resin-webui-dist
          path: webui/dist

      - name: Run Go race tests
        env:
          CGO_ENABLED: 1
        run: go test -race ./...

  build-binaries:
    name: Build Linux ${{ matrix.goarch }} binary
    runs-on: ubuntu-latest
    needs:
      - build-webui
      - verify-race
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        goarch:
          - amd64
          - arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebUI artifact
        uses: actions/download-artifact@v4
        with:
          name: resin-webui-dist
          path: webui/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true

      - name: Build Linux binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: main
          GIT_COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp || '' }}
        shell: bash
        run: |
          mkdir -p "release-bin/linux/${GOARCH}"
          go build -trimpath \
            -tags "with_quic with_wireguard with_grpc with_utls with_embedded_tor with_naive_outbound" \
            -ldflags="-s -w \
            -X github.com/Resinat/Resin/internal/buildinfo.Version=${VERSION} \
            -X github.com/Resinat/Resin/internal/buildinfo.GitCommit=${GIT_COMMIT} \
            -X github.com/Resinat/Resin/internal/buildinfo.BuildTime=${BUILD_TIME}" \
            -o "release-bin/linux/${GOARCH}/resin-linux-${GOARCH}" \
            ./cmd/resin

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: resin-linux-${{ matrix.goarch }}
          path: release-bin/linux/${{ matrix.goarch }}/resin-linux-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-architecture image
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: resin-linux-amd64
          path: release-bin/linux/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: resin-linux-arm64
          path: release-bin/linux/arm64

      - name: Make binaries executable
        run: chmod +x release-bin/linux/amd64/resin-linux-amd64 release-bin/linux/arm64/resin-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=main-,format=short

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.github/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-main
          cache-to: type=gha,mode=max,scope=docker-main

      - name: Write image summary
        run: |
          {
            echo "### Published Resin main image"
            echo
            echo '```text'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
